app_id: ai.nimi.openwhispr
display_name: OpenWhispr
version: 1.10.5
profile: standalone
npm_package_name: open-whispr
cargo_package_name: open-whispr-shell
tauri_identifier: ai.nimi.apps.ai.nimi.openwhispr
package_author: OpenWhispr Team <support@openwhispr.com>
submission_role: developer-submitted-input
capability_contract_refs:
  - audio.transcribe
  - text.generate
  - text.embed
  - audio.speaker.embed
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: "%USERPROFILE%/.openwhispr-nimi/**"
      purpose: OpenWhispr notes, recordings, history, settings and optional business service credentials
      expected_size_band: Megabytes for notes/settings; gigabytes depending on retained audio
    - path_pattern: ~/Library/Application Support/OpenWhispr-Nimi/**
      purpose: macOS App-owned notes, recordings, history and settings
      expected_size_band: Megabytes for notes/settings; gigabytes depending on retained audio
    - path_pattern: ~/.config/OpenWhispr-Nimi/**
      purpose: Linux App-owned notes, recordings, history and settings
      expected_size_band: Megabytes for notes/settings; gigabytes depending on retained audio
safety_profile:
  ai:
    direct_interaction: true
    interaction_notice: absent
    outputs:
      - export_visible_marking: absent
        exposure: publishable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: text
        publication_control: user-confirmed
    risk_features: []
    subject_notice: not-applicable
  content_descriptors:
    - unmoderated-shared-content
  data_practices:
    commercial_features:
      - subscription
    publisher_direct_external_network: true
    sensitive_data_categories:
      - contacts
      - biometric
    telemetry:
      - usage-analytics
    third_party_account: optional
    user_content_sharing: public
  high_impact_decision_uses:
    - biometric-identification
  intended_audience: general
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: README.md#support
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
